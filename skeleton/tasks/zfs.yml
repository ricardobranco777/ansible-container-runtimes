---
- name: Check if /var/lib/containers is a ZFS dataset
  command: findmnt -n -o FSTYPE --mountpoint /var/lib/containers
  register: containers_fstype
  changed_when: false
  failed_when: false

- name: Check if /var/lib/docker is a ZFS dataset
  command: findmnt -n -o FSTYPE --mountpoint /var/lib/docker
  register: docker_fstype
  changed_when: false
  failed_when: false

- name: Copy storage.conf for podman
  copy:
    src: zfs/storage.conf
    dest: /etc/containers/storage.conf
    owner: root
    group: root
    mode: '0644'
  when: containers_fstype.stdout == 'zfs'

- name: Read daemon.json
  slurp:
    src: /etc/docker/daemon.json
  register: daemon_json
  when: docker_fstype.stdout == 'zfs'

- name: Set storage-driver to zfs in daemon.json
  copy:
    content: "{{ daemon_json.content | b64decode | from_json | combine({'storage-driver': 'zfs'}) | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  when: docker_fstype.stdout == 'zfs'
